# Hakein agent config — ONE file to choose your AI.
# Change `active` (or any task below) to a name from `agents`, restart the server/worker.
# Keys are NEVER written here — each agent points at an env var you set in .env.
# Add your own entries freely: { provider, model, apiKeyEnv }. Whatever you list becomes choosable.

active: gemini

agents:
  # Fully local: Ollama on this machine, no key, no quota, no downloads needed.
  # Requires `ollama serve` running. Change `model` to any name from `ollama list`.
  ollama-local:
    provider: ollama
    model: qwen2.5-coder:14b

  gemini:
    provider: gemini
    model: gemini-3.8-flash
    apiKeyEnv: GEMINI_API_KEY

  gemini-flash:
    provider: gemini
    model: gemini-1.5-flash
    apiKeyEnv: GEMINI_API_KEY

  # Cheap + reliable vision for captcha screenshots (separate quota from resume models).
  gemini-vision:
    provider: gemini
    model: gemini-3.5-flash-lite
    apiKeyEnv: GEMINI_API_KEY

  openai:
    provider: openai
    model: gpt-4-turbo-preview
    apiKeyEnv: OPENAI_API_KEY

  openai-mini:
    provider: openai
    model: gpt-4o-mini
    apiKeyEnv: OPENAI_API_KEY

  anthropic:
    provider: anthropic
    model: claude-3-opus-20240229
    apiKeyEnv: ANTHROPIC_API_KEY

  anthropic-haiku:
    provider: anthropic
    model: claude-3-haiku-20240307
    apiKeyEnv: ANTHROPIC_API_KEY

  # One key, hundreds of models (https://openrouter.ai/models).
  # Swap `model` to anything, e.g. meta-llama/llama-3.1-70b-instruct, mistralai/mixtral-8x7b.
  openrouter:
    provider: openrouter
    model: meta-llama/llama-3.1-70b-instruct
    apiKeyEnv: OPENROUTER_API_KEY

  openrouter-cheap:
    provider: openrouter
    model: google/gemini-flash-1.5
    apiKeyEnv: OPENROUTER_API_KEY

# Per-job overrides. Each value must be a name from `agents`.
# Omit a task (or the whole block) and it follows `active`.
# `vision` (optional): agent used to SEE and solve captchas (screenshot -> LLM).
# Must be vision-capable (gemini/openai/openrouter/anthropic — NOT text-only ollama).
# Or set VISION_AGENT env var instead. Without it, captcha solving uses the qa agent.
tasks:
  resume: gemini
  qa: gemini
  scoring: gemini
  vision: gemini-vision
